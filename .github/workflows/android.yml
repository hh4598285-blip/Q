name: Bluetooth Mic Android Build

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: ["main"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager --install "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Build universal debug APK
        run: gradle --no-daemon clean assembleDebug

      - name: Verify APK structure, package and SDK metadata
        shell: bash
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          file "$APK"
          unzip -t "$APK" >/dev/null
          aapt2 dump badging "$APK" | tee badging.txt
          grep -F "package: name='com.daniel.bluetoothmic.clean' versionCode='1' versionName='1.0.0'" badging.txt
          grep -F "sdkVersion:'26'" badging.txt
          grep -F "targetSdkVersion:'30'" badging.txt
          zipinfo -1 "$APK" | grep -F "AndroidManifest.xml"
          zipinfo -1 "$APK" | grep -F "resources.arsc"

      - name: Verify APK signature
        shell: bash
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/debug/app-debug.apk"
          apksigner verify --verbose "$APK"
          apksigner verify --print-certs "$APK" | tee signature.txt

      - name: Calculate APK size and SHA-256
        shell: bash
        run: |
          APK="app/build/outputs/apk/debug/app-debug.apk"
          stat -c "APK_SIZE_BYTES=%s" "$APK" | tee build-summary.txt
          sha256sum "$APK" | tee -a build-summary.txt
          echo "BUILD_STATUS=PASSED" | tee -a build-summary.txt
          echo "INSTALLATION_TESTED_ON_REAL_DEVICE=NO" | tee -a build-summary.txt

      - name: Rename final APK
        run: cp app/build/outputs/apk/debug/app-debug.apk BluetoothMic-1.0.0.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: BluetoothMic-1.0.0
          path: BluetoothMic-1.0.0.apk
          if-no-files-found: error

      - name: Upload verification reports
        uses: actions/upload-artifact@v4
        with:
          name: BluetoothMic-verification
          path: |
            badging.txt
            signature.txt
            build-summary.txt
